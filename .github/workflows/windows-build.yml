
name: Windows Dev Studio Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Package Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Windows Dependencies
        run: >
          dotnet restore
          src/WindowsDevStudio/WindowsDevStudio.csproj
          -r win-x64

      - name: Publish Windows EXE
        run: >
          dotnet publish
          src/WindowsDevStudio/WindowsDevStudio.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload Windows EXE Package
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Dev-Studio-win-x64
          path: publish/
          if-no-files-found: error
          retention-days: 14
